{% set name = "nvtx" %}
{% set version = "0.2.16" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  - url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/nvtx-{{ version }}.tar.gz
    sha256: 252fdb870308be4a2beecb3ed174b1d59099eeb63c883f269944a765ce5f7720

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
  host:
    - cython >=3.1
    - nvtx-c
    - pip
    - python
    - setuptools
  run:
    - python

test:
  source_files:
    - tests
  imports:
    - nvtx
    - nvtx._lib
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/NVIDIA/NVTX
  summary: nvtx - Python code annotation library
  description: |
    Python wrapper for NVTX, a cross-platform API for annotating source code
    to provide contextual information to developer tools.
  license: Apache-2.0 WITH LLVM-exception
  license_family: Apache
  license_file: LICENSE.txt
  dev_url: https://github.com/NVIDIA/NVTX
  doc_url: https://nvidia.github.io/NVTX/python

extra:
  recipe-maintainers:
    - guysz-nvidia
    - conda-forge/cuda
    - bdice
    - shwina
